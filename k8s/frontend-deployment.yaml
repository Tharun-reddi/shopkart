apiVersion: apps/v1
kind: Deployment
metadata:
	name: shopkart-frontend
	namespace: shopkart
spec:
	replicas: 2
	selector:
		matchLabels:
			app: shopkart-frontend
	template:
		metadata:
			labels:
				app: shopkart-frontend
		spec:
			containers:
				- name: frontend
					image: tharunreddy04/shopkart-frontend:8
					imagePullPolicy: IfNotPresent
					ports:
						- containerPort: 80
					readinessProbe:
						httpGet:
							path: /
							port: 80
						periodSeconds: 5
					livenessProbe:
						httpGet:
							path: /
							port: 80
						periodSeconds: 10
